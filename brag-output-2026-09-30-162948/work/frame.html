<html lang="en">
<head>

<title>ULPF — project walkthrough</title>
<style>
  @font-face{font-family:'JBM';src:local('JetBrains Mono'),local('JetBrainsMono-Regular');font-weight:400;}
  @font-face{font-family:'JBM';src:local('JetBrains Mono Medium'),local('JetBrainsMono-Medium');font-weight:500;}
  @font-face{font-family:'JBM';src:local('JetBrains Mono ExtraBold'),local('JetBrainsMono-ExtraBold');font-weight:800;}
  @font-face{font-family:'LS';src:local('Liberation Sans'),local('LiberationSans-Regular');font-weight:400;}
  @font-face{font-family:'LS';src:local('Liberation Sans Bold'),local('LiberationSans-Bold');font-weight:700;}

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1920px;height:1080px;overflow:hidden;background:#07090d;}
  body{font-family:'JBM',monospace;-webkit-font-smoothing:antialiased;}

  #stage{position:relative;width:1920px;height:1080px;background:#07090d;overflow:hidden;}
  .grid{position:absolute;inset:0;
    background-image:linear-gradient(rgba(77,159,255,.045) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(77,159,255,.045) 1px,transparent 1px);
    background-size:64px 64px;}
  .vign{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 40%,rgba(0,0,0,.55) 100%);}
  .scene{position:absolute;inset:0;opacity:0;}

  .wrap{position:absolute;left:110px;right:110px;top:96px;bottom:120px;}

  /* ---- type ---- */
  .h1{font-family:'LS',sans-serif;font-weight:700;font-size:76px;letter-spacing:-1.5px;line-height:1.06;color:#e6edf3;}
  .h2{font-family:'LS',sans-serif;font-weight:700;font-size:54px;letter-spacing:-.8px;line-height:1.1;color:#e6edf3;}
  .h3{font-family:'JBM';font-weight:500;font-size:32px;letter-spacing:-.3px;color:#e6edf3;}
  .lede{font-family:'LS',sans-serif;font-size:31px;line-height:1.42;color:#8b949e;}
  .mono{font-family:'JBM';}
  .dim{color:#8b949e;} .faint{color:#6e7681;}
  .g{color:#3ddc84;} .b{color:#4d9fff;} .r{color:#ff5c5c;}
  .a{color:#f5a524;} .v{color:#a78bfa;} .w{color:#e6edf3;}
  .caps{font-size:19px;letter-spacing:2.6px;text-transform:uppercase;color:#6e7681;}

  /* ---- chrome ---- */
  .chip{display:inline-block;padding:5px 13px;border-radius:5px;font-size:17px;font-weight:500;
        letter-spacing:.4px;border:1px solid;background:rgba(255,255,255,.03);}
  .panel{background:#0d1117;border:1px solid #21262d;border-radius:10px;}
  .raised{background:#161b22;}
  .hair{height:1px;background:#21262d;}

  .kicker{position:absolute;left:110px;top:52px;display:flex;gap:14px;align-items:center;}
  .kt{font-size:18px;letter-spacing:2.4px;text-transform:uppercase;color:#6e7681;}
  .srcbadge{position:absolute;right:110px;top:52px;font-size:17px;color:#6e7681;letter-spacing:.6px;}

  /* ---- code ---- */
  pre.code{font-family:'JBM';font-size:22px;line-height:1.62;color:#c9d1d9;white-space:pre;}
  pre.code.sm{font-size:19px;line-height:1.55;}
  pre.code.xs{font-size:17px;line-height:1.5;}
  .k{color:#ff7b72;} .t{color:#79c0ff;} .s{color:#a5d6ff;} .n{color:#f0883e;}
  .c{color:#6e7681;font-style:italic;} .p{color:#3ddc84;}

  /* ---- chapter rail ---- */
  #rail{position:absolute;left:110px;right:110px;bottom:52px;height:34px;display:flex;gap:8px;align-items:flex-end;}
  .rseg{height:3px;background:#21262d;border-radius:2px;position:relative;}
  .rfill{position:absolute;left:0;top:0;bottom:0;width:0;background:#3ddc84;opacity:.85;border-radius:2px;}
  .rlab{position:absolute;left:0;top:-26px;font-size:14px;letter-spacing:1.8px;text-transform:uppercase;
        color:#3a4149;white-space:nowrap;transition:color .3s;}
  .rlab.on{color:#8b949e;}

  /* ---- tables ---- */
  table.tb{width:100%;border-collapse:collapse;font-family:'JBM';}
  table.tb th{font-size:17px;letter-spacing:1.8px;text-transform:uppercase;color:#6e7681;
              text-align:left;padding:0 0 12px 0;font-weight:500;}
  table.tb td{font-size:25px;padding:13px 0;border-top:1px solid #161b22;color:#c9d1d9;vertical-align:top;}
  table.tb td.n{font-variant-numeric:tabular-nums;}

  .bar{height:26px;border-radius:4px;position:relative;}
  .barfill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;width:0;}

  .logline{font-family:'JBM';font-size:19px;line-height:1.45;color:#c9d1d9;background:#0d1117;
           border:1px solid #21262d;border-left-width:3px;border-radius:6px;padding:13px 18px;
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .txline{font-family:'JBM';font-size:26px;line-height:1.35;color:#8b949e;white-space:nowrap;overflow:hidden;}

  .num{font-variant-numeric:tabular-nums;}
  .glow{text-shadow:0 0 34px rgba(61,220,132,.42);}
  .glowb{text-shadow:0 0 34px rgba(77,159,255,.42);}
  .glowr{text-shadow:0 0 34px rgba(255,92,92,.45);}

/* ============================ helpers ============================ */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const outCubic=t=>1-Math.pow(1-t,3);
const outQuint=t=>1-Math.pow(1-t,5);
const inOutCubic=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const outBack=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
// progress inside [a,b] of t, eased
const win=(t,a,b,e)=>{const u=clamp((t-a)/(b-a),0,1);return e?e(u):u;};
// reveal: rise in over `dur` starting at `at`, then hold
const rev=(t,at,dur)=>outCubic(clamp((t-at)/dur,0,1));
// count-up with easing
const count=(t,at,dur,to,from=0)=>{const u=outCubic(clamp((t-at)/dur,0,1));return from+(to-from)*u;};
const fmt=n=>Math.round(n).toLocaleString('en-US');

const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function px(n){return n+'px';}

/* ---- tiny syntax highlighter (single pass, no nested-span corruption) ---- */
const KW=new Set(['func','return','if','else','for','range','go','defer','case','select','var','const',
  'type','struct','import','package','nil','true','false','chan','map','switch','break','continue','interface']);
const TY=new Set(['string','int','int64','uint64','byte','error','bool','any','int32','float64','uint8']);
function hlLine(line,lang){
  let out='',i=0;
  while(i<line.length){
    const ch=line[i];
    if(lang!=='json'&&(line.startsWith('//',i)||(lang==='sh'&&ch==='#'))){out+='<span class="c">'+esc(line.slice(i))+'</span>';break;}
    if(lang==='sh'&&line.startsWith('$ ',i)){out+='<span class="p">$</span>';i++;continue;}
    if(ch==='"'||ch==='`'||ch==="'"){
      let j=i+1;
      while(j<line.length&&line[j]!==ch){if(ch!=='`'&&line[j]==='\\')j++;j++;}
      out+='<span class="s">'+esc(line.slice(i,Math.min(j+1,line.length)))+'</span>';i=j+1;continue;
    }
    if(ch>='0'&&ch<='9'){let j=i;while(j<line.length&&/[0-9._]/.test(line[j]))j++;
      out+='<span class="n">'+esc(line.slice(i,j))+'</span>';i=j;continue;}
    if(/[A-Za-z_]/.test(ch)){let j=i;while(j<line.length&&/[A-Za-z0-9_]/.test(line[j]))j++;
      const w=line.slice(i,j);
      out+=KW.has(w)?'<span class="k">'+esc(w)+'</span>'
          :TY.has(w)?'<span class="t">'+esc(w)+'</span>':esc(w);
      i=j;continue;}
    out+=esc(ch);i++;
  }
  return out;
}
const hl=(arr,lang)=>arr.map(l=>hlLine(l,lang)).join('\n');
function codeBlock(lines,lang,cls){
  const pre=el('pre','code'+(cls?' '+cls:''));
  pre.innerHTML=hl(lines,lang||'go');
  return pre;
}

/* ============================ scene shell ============================ */
const layers=document.getElementById('layers');
const SCENES=[];
function scene(id,name,build,update){SCENES.push({id,name,build,update,node:null,built:false});}
function chrome(node,label,src){
  if(label){const k=el('div','kicker');
    k.appendChild(el('span','kt',label));
    node.appendChild(k);}
  if(src)node.appendChild(el('div','srcbadge',src));
  return node;
}
// scene in/out envelopes: dip through near-black on hard cuts
function envelope(t,st,en){
  const len=en-st, f=Math.min(0.5,len*0.18);
  return Math.min(win(t,0,f,outCubic),win(len-t,0,f,outCubic));
}

    chip.style.cssText='position:absolute;left:-14px;top:11px;';
    const c=el('span','chip',d.vendor);
    c.style.color=C[k==='cisco'?'cisco':k==='fortigate'?'fortigate':k==='suricata'?'suricata':'linux'];
    c.style.borderColor=c.style.color;
    chip.appendChild(c);
    const ln=el('div','logline');
    ln.style.borderLeftColor=C[k==='cisco'?'cisco':k==='fortigate'?'fortigate':k==='suricata'?'suricata':'linux'];
    ln.textContent=d.line;
    box.appendChild(chip);box.appendChild(ln);
    w.appendChild(box);
    return {box,ln};
  });
  const t1=el('div','h1','Four perimeter devices. Four log formats.');
  t1.style.cssText='font-size:52px;margin-bottom:8px;';
  const t2=el('div','h2 r','Zero of them agree.');
  t2.style.cssText='font-size:52px;';
  w.appendChild(t1);w.appendChild(t2);
  n.appendChild(w);
  n._t1=t1;n._t2=t2;
  return n;
},function(n,t){
  n._lines.forEach((L,i)=>{
    const p=rev(t,0.25+i*0.72,0.6);
    const slide=(1-p)*46;
    L.box.style.opacity=p;
    L.box.style.transform='translateX('+slide+'px)';
  });
  const a=rev(t,3.7,0.7);
  n._t1.style.opacity=a; n._t1.style.transform='translateY('+((1-a)*20)+'px)';
  const b=rev(t,4.6,0.7);
  n._t2.style.opacity=b; n._t2.style.transform='translateY('+((1-b)*20)+'px)';
});

  n._pk=names.map((nm,i)=>{

});

    '<span class="w">per file</span>. That is a 10–100× unlock, and it has nothing to do with parsing.');
  db.style.cssText='font-family:LS,sans-serif;font-size:23px;line-height:1.42;color:#c9d1d9;margin-top:12px;';
  dec.appendChild(dl);dec.appendChild(db);
  p0.appendChild(dec);n._dec=dec;
  two.appendChild(p0);n._p0=p0;

  // P1/P2 — static reference block, not read at speed
  const rest=el('div','panel');
  rest.style.cssText='flex:1;padding:28px 32px;';
  const h1b=el('div');
  h1b.style.cssText='display:flex;align-items:center;gap:14px;margin-bottom:20px;';
  const b1=el('div','chip','P1');
  b1.style.cssText='color:#f5a524;border-color:#f5a524;font-size:16px;';
  const t1=el('div','h3 a','cheap, after correctness');
  t1.style.fontSize='21px';
  h1b.appendChild(b1);h1b.appendChild(t1);
  rest.appendChild(h1b);
  ['BatchSize 500 → 2,000 — fewer, larger transactions',
   'Apply the linux.go treatment to cisco_asa.go (now slowest, 16,908 ns/line)',
   'Pre-size the FortiGate output map — 803 B/line, highest of the four']
    .forEach(s=>{
      const r=el('div','faint','· '+s);
      r.style.cssText='font-size:18px;padding:7px 0;line-height:1.4;';
      rest.appendChild(r);
    });
  const h2b=el('div');
  h2b.style.cssText='display:flex;align-items:center;gap:14px;margin:24px 0 16px 0;';
  const b2=el('div','chip','P2');
  b2.style.cssText='color:#4d9fff;border-color:#4d9fff;font-size:16px;';
  const t2=el('div','h3 b','cleanup');
  t2.style.fontSize='21px';
  h2b.appendChild(b2);h2b.appendChild(t2);
  rest.appendChild(h2b);
  ['Cheaper Suricata.Detect — 524 ns/line, runs on every line',
   'Drop the committed 17 MB backend binary']
    .forEach(s=>{
      const r=el('div','faint','· '+s);
      r.style.cssText='font-size:18px;padding:7px 0;line-height:1.4;';
      rest.appendChild(r);
    });
  two.appendChild(rest);
  n.appendChild(w);
  return n;
},function(n,t){
  const a=rev(t,0.5,0.7);
  n._p0.style.opacity=a;
  n._p0.style.transform='translateX('+((1-a)*-24)+'px)';
  n._p0rows.forEach((r,i)=>{
    const p=rev(t,1.1+i*0.4,0.4);
    r.style.opacity=0.15+0.85*p;
    r.style.transform='translateX('+((1-p)*16)+'px)';
  });
  n._dec.style.opacity=rev(t,3.0,0.8);
});

/* --- 23 : closing --- */
scene(23,'closing',function(){
  const n=el('div');
  const w=el('div','wrap');w.style.cssText='left:0;right:0;top:0;bottom:0;display:flex;'+

      C[k==='cisco'?'cisco':k==='fortigate'?'fortigate':k==='suricata'?'suricata':'linux']+';opacity:.75;';
    stack.appendChild(d);return d;

  const meta=el('div','faint mono','parsers merged on main  ·  pipeline + store on feature/phase2-pipeline');
  meta.style.cssText='font-size:18px;margin-top:26px;letter-spacing:.4px;';
  w.appendChild(meta);n._meta=meta;
  const foot=el('div','faint',DATA.meta.ps+' · '+DATA.meta.team);

  n._rows.forEach((r,i)=>{

  });
  const w=rev(t,0.9,0.8);
  n._wm.style.opacity=w;n._wm.style.transform='scale('+(0.92+0.08*outBack(w))+')';
  n._l1.style.opacity=rev(t,1.7,0.7);
  n._l2.style.opacity=rev(t,2.4,0.7);

/* ============================ rail ============================ */
const ACTS=[
  {n:'problem',a:0,b:32},
  {n:'architecture',a:32,b:80},
  {n:'deep dive',a:80,b:180},
  {n:'optimization',a:180,b:227},
  {n:'impact',a:227,b:268}
];
const rail=document.getElementById('rail');
const rsegs=ACTS.map(A=>{
  const s=el('div','rseg');
  s.style.flex=String(A.b-A.a);
  const f=el('div','rfill');
  s.appendChild(f);
  const l=el('div','rlab',A.n);
  s.appendChild(l);
  rail.appendChild(s);
  return {s,f,l,a:A.a,b:A.b};
});

/* ============================ build + render ============================ */
SCENES.forEach(S=>{S.node=S.build();layers.appendChild(S.node);});
const D=DATA.meta.duration;

// Optical centring pass. Scenes are authored top-down, which leaves a lot of
// dead space under short ones. Measure each scene's real content block once at
// full reveal and store a translateY that centres it in the band between the
// header and the chapter rail. Full-bleed scenes (title, closing) are already
// flex-centred and are left alone.
const BAND_TOP=100, BAND_BOT=952;
(function layout(){
  const saved=SCENES.map(S=>S.node.style.transform);
  for(const S of SCENES){
    const sc=DATA.scenes[S.id-1];
    S.node.style.opacity='1';
    S.update(S.node,sc.end-sc.start);
    let top=1e9,bot=-1e9;
    S.node.querySelectorAll('*').forEach(e=>{
      if(e.classList.contains('rseg'))return;
      const b=e.getBoundingClientRect();
      if(b.width<2&&b.height<2)return;
      const leaf=e.children.length===0||e.classList.contains('panel')||e.classList.contains('logline');
      if(!leaf)return;
      if(b.top<top)top=b.top; if(b.bottom>bot)bot=b.bottom;
    });
    let shift=0;
    if(top<1e8&&bot>-1e8){
      const mid=(top+bot)/2, want=(BAND_TOP+BAND_BOT)/2;
      shift=Math.round(want-mid);
      // never push content so far it collides with the header
      if(top+shift<BAND_TOP-40)shift=BAND_TOP-40-top;
      if(bot+shift>1074)shift=1074-bot;
      if(Math.abs(shift)<18)shift=0;
    }
    S.shift=shift;
  }
  SCENES.forEach((S,i)=>{S.node.style.opacity='0';S.node.style.transform=saved[i];});
})();

function __renderAt(t){
  // rail
  rsegs.forEach(R=>{
    const u=clamp((t-R.a)/(R.b-R.a),0,1);
    R.f.style.width=(u*100)+'%';
    R.l.className='rlab'+(t>=R.a&&t<R.b?' on':'');
  });
  // scenes
  for(const S of SCENES){
    const sc=DATA.scenes[S.id-1];
    if(t<sc.start||t>=sc.end){if(S.node.style.opacity!=='0')S.node.style.opacity='0';continue;}
    S.update(S.node,t-sc.start);
    // soft envelope: every scene is >=7s, so this is a 0.5s dip at each end
    S.node.style.opacity=String(envelope(t-sc.start,0,sc.end-sc.start));
    S.node.style.transform=S.shift?'translateY('+S.shift+'px)':'';
  }
}
window.__renderAt=__renderAt;
__renderAt(0);
